# How alerts reach you.
#   critical  -> Pushover EMERGENCY (repeats until you acknowledge in the app)   [wakes you]
#   warning   -> ONE Pushover message each morning (08:00-09:00), normal priority [next day]
#               exception: backup problems (alert names Backup*, HyperBackup*, NodeBackup*, NodeImageBackup*) are pushed the same
#               day, normal priority, between 07:00 and 22:00 (never overnight) and repeated every 6 h until fixed
#   Watchdog  -> external dead-man's switch (healthchecks.io) every 2 minutes
# Secrets are files under /opt/monitoring/secrets (never in git).
global:
  resolve_timeout: 5m

templates: ["/etc/alertmanager/templates/*.tmpl"]

time_intervals:
  - name: daytime
    time_intervals:
      - times: [{start_time: "07:00", end_time: "22:00"}]
        location: America/Los_Angeles

route:
  receiver: "null"      # warnings are NOT pushed individually: they appear in the 08:00 summary (scripts/daily-summary.py)
  group_by: []
  group_wait: 1m
  group_interval: 30m
  repeat_interval: 24h
  routes:
    - matchers: [alertname="Watchdog"]
      receiver: deadmans-switch
      group_by: [alertname]
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 2m
      continue: false

    - matchers: [severity="critical"]
      receiver: pager
      group_by: [alertname, host]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    # A whole remote site is unreachable (Boston is critical above): tell me during the day, normal priority, and when it recovers.
    # Outside 07:00-22:00 it waits for the 08:00 summary (or goes out at 07:00 if it is still down).
    - matchers: [alertname="SiteDown", severity="warning"]
      receiver: site-notice
      group_by: [alertname, site]
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 12h
      active_time_intervals: [daytime]

    # Wi-Fi sign-in (FreeRADIUS on authentik) is down: nobody can join "Rainbowlink Identity". Daytime push, normal priority, with a recovery notice;
    # outside 07:00-22:00 it waits for the 08:00 summary (or goes out at 07:00 if still down).
    - matchers: [alertname="WifiRadiusDown", severity="warning"]
      receiver: site-notice
      group_by: [alertname]
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h
      active_time_intervals: [daytime]

    # Backup problems: a failed or overdue backup should be known the same day, but not at 03:00.
    # Pushed (normal priority) while the daytime window is open, repeated every 6 h while it persists. Outside the window the notice
    # waits and goes out when it opens at 07:00 if still firing (the 08:00 summary lists it as well). Everything named like a backup
    # job lands here: BackupMissing/NeverRan/JobFailed/Artifact*, HyperBackup*, NodeBackup*, NodeImageBackup*. Name new backup alerts the same way.
    - matchers: [severity="warning", alertname=~"(Backup|HyperBackup|NodeBackup|NodeImageBackup).*"]
      receiver: backup-notice
      group_by: [alertname]
      group_wait: 2m
      group_interval: 15m
      repeat_interval: 6h
      active_time_intervals: [daytime]

    - matchers: [severity="warning"]
      receiver: "null"

    - matchers: [severity="none"]
      receiver: "null"

receivers:
  - name: "null"

  - name: pager
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user
        token_file: /run/secrets/pushover_token
        priority: '{{ if eq .Status "firing" }}2{{ else }}0{{ end }}'
        retry: 300s          # re-alert every 5 min until acknowledged ...
        expire: 1h           # ... for at most 1 hour
        sound: siren
        title: '{{ template "rl.title" . }}'
        message: '{{ template "rl.message" . }}'
        html: true
        url: https://grafana.rainbowlink.org/d/rl-overview
        url_title: Open the Overview dashboard
        send_resolved: true

  - name: site-notice
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user
        token_file: /run/secrets/pushover_token
        priority: '0'
        title: '{{ template "rl.title" . }}'
        message: '{{ template "rl.message" . }}'
        html: true
        url: https://grafana.rainbowlink.org/d/rl-status
        url_title: Open the Status board
        send_resolved: true

  - name: backup-notice
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user
        token_file: /run/secrets/pushover_token
        priority: '0'
        title: '{{ template "rl.title" . }}'
        message: '{{ template "rl.message" . }}'
        html: true
        url: https://grafana.rainbowlink.org/d/rl-backups
        url_title: Open the Backups dashboard
        send_resolved: true

  - name: deadmans-switch
    webhook_configs:
      - url_file: /run/secrets/healthchecks_url
        send_resolved: false
        max_alerts: 1

# Dependencies: when the cause is firing, the symptoms stay quiet.
inhibit_rules:
  # A remote site that is down hides everything about hosts/services at that site.
  - source_matchers: [alertname="SiteDown"]
    target_matchers: [alertname!="SiteDown"]
    equal: [site]
  # No internet at home hides every remote-site and public-service alert.
  - source_matchers: [alertname="WanDown"]
    target_matchers: ['site=~"pcb|sjc|bos"']
  - source_matchers: [alertname="WanDown"]
    target_matchers: [alertname=~"PublicServiceDown|SiteLink.*|SiteDown|MeshProbeStale|DnsResolverFailing|DnsSplitHorizonBroken"]
  # Home gateway down hides everything at home.
  - source_matchers: [alertname=~"HostDown.*", host="gateway"]
    target_matchers: ['site="pdx"', 'host!="gateway"']
  # Proxmox host down hides every guest and the services running on them (but not the NAS/gateway).
  - source_matchers: [alertname=~"HostDown.*", host="pve0"]
    target_matchers: ['site="pdx"', 'host!~"pve0|nas|gateway"']
  # A host that is down hides its own services, agent and disk/etc. alerts.
  - source_matchers: [alertname=~"HostDown.*"]
    target_matchers: [alertname!~"HostDown.*"]
    equal: [host]
  # Tailnet trouble explains a bunch of ExporterDown alerts.
  - source_matchers: [alertname="TailnetDegraded"]
    target_matchers: [alertname="ExporterDown"]
  # DNS outage hides the per-resolver alert.
  - source_matchers: [alertname="DnsOutage"]
    target_matchers: [alertname="DnsResolverFailing"]
  # A host that is down or exporter-less cannot produce meaningful host metrics alerts.
  - source_matchers: [alertname="ExporterDown"]
    target_matchers: [alertname=~"HostMetricsCollectorStale|MeshProbeStale"]
    equal: [host]
