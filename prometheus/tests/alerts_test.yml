# Unit tests for alert rules: `promtool test rules` runs these on every ./scripts/apply.sh.
# Add a case when you add or change a rule you care about.
rule_files:
  - ../rules/40-storage-backups.yml
  - ../rules/10-hosts.yml
  - ../rules/60-disk-health.yml
  - ../rules/50-pbx-nas-gateway.yml
  - ../rules/30-services.yml
evaluation_interval: 1m

tests:
  # Hyper Backup: daily ~09:35; alert only after 28h + 30m grace.
  - interval: 1m
    input_series:
      - series: 'rl_hyperbackup_last_commit_timestamp_seconds{repo="nas_hq_set2", host="pi-pcb"}'
        values: '0+0x6000'                      # last commit at t=0 and never again
    alert_rule_test:
      - eval_time: 27h
        alertname: HyperBackupStale
        exp_alerts: []                          # 27h old: still within the daily window + grace
      - eval_time: 28h20m
        alertname: HyperBackupStale
        exp_alerts: []                          # over 28h but inside the 30 min "for"
      - eval_time: 29h
        alertname: HyperBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, site: pcb, repo: nas_hq_set2, host: pi-pcb}
            exp_annotations:
              summary: "No NAS Hyper Backup (nas_hq_set2) has completed for 1d 5h 0m 0s"
              description: "Expected daily around 09:35. Check Hyper Backup on the NAS (task log) and the rsync link to pi-pcb."

  # Fresh backups never alert.
  - interval: 1m
    input_series:
      - series: 'rl_hyperbackup_last_commit_timestamp_seconds{repo="nas_hq_set2", host="pi-pcb"}'
        values: '0+60x6000'                     # timestamp advances with time = always fresh
    alert_rule_test:
      - eval_time: 40h
        alertname: HyperBackupStale
        exp_alerts: []

  # A stuck run (lock files kept alive for 12h+).
  - interval: 1m
    input_series:
      - series: 'rl_hyperbackup_running{repo="nas_hq_set2", host="pi-pcb"}'
        values: '1x1000'
    alert_rule_test:
      - eval_time: 13h
        alertname: HyperBackupStuck
        exp_alerts:
          - exp_labels: {severity: warning, site: pcb, repo: nas_hq_set2, host: pi-pcb}
            exp_annotations:
              summary: "Hyper Backup nas_hq_set2 has been running for over 12 hours"
              description: "A run normally takes minutes. It may be hung or the repository locked."


  # NAS disk with 2 pending sectors -> alert after 1h; a clean disk (0) stays quiet.
  - interval: 1m
    input_series:
      - {series: 'diskSMARTAttrRaw{job="snmp-nas", diskSMARTInfoIndex="3"}', values: '2x200'}
      - {series: 'diskSMARTAttrName{job="snmp-nas", diskSMARTInfoIndex="3", diskSMARTAttrName="Current_Pending_Sector"}', values: '1x200'}
      - {series: 'diskSMARTInfoDevName{job="snmp-nas", diskSMARTInfoIndex="3", diskSMARTInfoDevName="/dev/sdb"}', values: '1x200'}
      - {series: 'diskSMARTAttrRaw{job="snmp-nas", diskSMARTInfoIndex="20"}', values: '0x200'}
      - {series: 'diskSMARTAttrName{job="snmp-nas", diskSMARTInfoIndex="20", diskSMARTAttrName="Current_Pending_Sector"}', values: '1x200'}
      - {series: 'diskSMARTInfoDevName{job="snmp-nas", diskSMARTInfoIndex="20", diskSMARTInfoDevName="/dev/sdd"}', values: '1x200'}
    alert_rule_test:
      - eval_time: 90m
        alertname: NasDiskSmartErrors
        exp_alerts:
          - exp_labels: {severity: warning, host: nas, site: pdx, job: snmp-nas, diskSMARTInfoIndex: "3", diskSMARTAttrName: Current_Pending_Sector, diskSMARTInfoDevName: /dev/sdb}
            exp_annotations:
              summary: "NAS disk /dev/sdb: Current_Pending_Sector is 2 (should be 0)"
              description: "Unreadable sectors are the usual early warning of a failing drive. Check Storage Manager > HDD/SSD and plan a replacement."

  # NVMe at 85% wear alerts; at 4% does not.
  - interval: 1m
    input_series:
      - {series: 'nvme_percentage_used_ratio{host="pve0", device="nvme0n1"}', values: '0.85x10'}
      - {series: 'nvme_percentage_used_ratio{host="pve1", device="nvme0n1"}', values: '0.04x10'}
    alert_rule_test:
      - eval_time: 5m
        alertname: NvmeWearHigh
        exp_alerts:
          - exp_labels: {severity: warning, host: pve0, device: nvme0n1}
            exp_annotations:
              summary: "pve0: NVMe nvme0n1 is 85% worn out"
              description: "Plan a replacement before 100%."

  # Thin pool metadata at 80% alerts after 30m; healthy pool is quiet.
  - interval: 1m
    input_series:
      - {series: 'rl_lvm_thinpool_metadata_ratio{host="pve0", vg="hdd", lv="hdd"}', values: '0.8x100'}
      - {series: 'rl_lvm_thinpool_data_ratio{host="pve0", vg="hdd", lv="hdd"}', values: '0.5x100'}
      - {series: 'rl_lvm_thinpool_data_ratio{host="pve0", vg="pve", lv="data"}', values: '0.4x100'}
      - {series: 'rl_lvm_thinpool_metadata_ratio{host="pve0", vg="pve", lv="data"}', values: '0.02x100'}
    alert_rule_test:
      - eval_time: 45m
        alertname: LvmThinPoolFull
        exp_alerts:
          - exp_labels: {severity: warning, host: pve0, vg: hdd, lv: hdd}
            exp_annotations:
              summary: "pve0: LVM thin pool hdd/hdd is filling up (80%)"
              description: "A thin pool that runs out of data OR metadata space freezes/corrupts every guest on it. Free space or extend it."

  # PBX: the HomeAssistant registration is ignored; a carrier trunk that stays down alerts.
  - interval: 1m
    input_series:
      - {series: 'rl_asterisk_registration_up{trunk="HomeAssistant", status="Rejected"}', values: '0x60'}
      - {series: 'rl_asterisk_registration_up{trunk="BulkVS", status="Rejected"}', values: '0x60'}
      - {series: 'rl_asterisk_registration_up{trunk="voipms", status="Registered"}', values: '1x60'}
    alert_rule_test:
      - eval_time: 20m
        alertname: PbxTrunkDown
        exp_alerts:
          - exp_labels: {severity: warning, host: vps-bos, site: bos, trunk: BulkVS, status: Rejected}
            exp_annotations:
              summary: "PBX trunk BulkVS is not registered (Rejected)"
              description: "Check credentials/IP allow-list for this trunk (pjsip show registrations)."

  # Home Assistant voice satellite unavailable for 10m -> alert; available -> quiet.
  - interval: 1m
    input_series:
      - {series: 'homeassistant_entity_available{entity="assist_satellite.72_61_72_237"}', values: '0x30'}
    alert_rule_test:
      - eval_time: 20m
        alertname: HaVoipSatelliteUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, host: homeassistant, site: pdx, entity: assist_satellite.72_61_72_237}
            exp_annotations:
              summary: "Home Assistant's VoIP voice assistant (PBX2) is unavailable"
              description: "Voice commands over the phone system will not work. Check the VoIP integration in Home Assistant."

  # UniFi memory: 73% (a healthy gateway) stays quiet; 95% for 30m+ alerts.
  - interval: 1m
    input_series:
      - {series: 'unpoller_device_memory_utilization_ratio{name="Humboldt", type="udm"}', values: '0.73x60'}
      - {series: 'unpoller_device_memory_utilization_ratio{name="Office AP", type="uap"}', values: '0.95x60'}
    alert_rule_test:
      - eval_time: 45m
        alertname: UnifiDeviceMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, host: gateway, site: pdx, name: Office AP, type: uap}
            exp_annotations:
              summary: "UniFi device Office AP memory is at 95%"

  # DNS sync: one server lagging behind for 15m+ alerts; identical serials stay quiet.
  - interval: 1m
    input_series:
      - {series: 'rl_dns_zone_serial{zone="rainbowlink.org", server="dns1", sync="all"}', values: '1156x40'}
      - {series: 'rl_dns_zone_serial{zone="rainbowlink.org", server="dns2", sync="all"}', values: '1156x40'}
      - {series: 'rl_dns_zone_serial{zone="rainbowlink.org", server="pi-pcb", sync="all"}', values: '1155x40'}
      - {series: 'rl_dns_zone_serial{zone="dns.rainbowlink.org", server="dns1", sync="primary"}', values: '65x40'}
    alert_rule_test:
      - eval_time: 10m
        alertname: DnsZoneOutOfSync
        exp_alerts: []                       # still inside the 15 minute allowance for replication lag
      - eval_time: 25m
        alertname: DnsZoneOutOfSync
        exp_alerts:
          - exp_labels: {severity: warning, site: pdx, zone: rainbowlink.org}
            exp_annotations:
              summary: "DNS servers disagree on zone rainbowlink.org (some are serving an older copy)"
              description: "Compare the serials on the Network dashboard (Zone sync). A resolver with a stale zone returns old answers. Check Technitium zone transfer/cluster sync on the lagging server."

  # Split-horizon: tailnet view returning the wrong address for 10m+ alerts; a good resolver stays quiet.
  - interval: 1m
    input_series:
      - {series: 'probe_success{job="dns-split", host="dns2", instance="100.64.0.18", site="pdx", service="dns-split"}', values: '1x5 0x30'}
      - {series: 'probe_success{job="dns-split", host="dns1", instance="100.64.0.26", site="pdx", service="dns-split"}', values: '1x35'}
    alert_rule_test:
      - eval_time: 8m
        alertname: DnsSplitHorizonBroken
        exp_alerts: []
      - eval_time: 25m
        alertname: DnsSplitHorizonBroken
        exp_alerts:
          - exp_labels: {severity: warning, job: dns-split, host: dns2, instance: 100.64.0.18, site: pdx, service: dns-split}
            exp_annotations:
              summary: "Resolver dns2 is not giving tailnet clients tailnet addresses"
              description: "A tailnet-only host (vps-sjc) asked 100.64.0.18 for ha.rainbowlink.org and did not get 100.64.0.27. Check the Split Horizon app (enabled, config present) on that Technitium node. Home clients are unaffected."

  # IP phones: a phone that stays unregistered for 20 minutes is reported; one that comes back (or a reboot blip) is not.
  - interval: 1m
    input_series:
      - series: 'rl_asterisk_extension_up{ext="96111", name="Office"}'
        values: '1x5 0x40'                      # drops at t=5m, never returns
      - series: 'rl_asterisk_extension_up{ext="96121", name="Living Room"}'
        values: '1x5 0x10 1x30'                 # 10 minute outage (reboot): below the 20 minute grace
    alert_rule_test:
      - eval_time: 15m
        alertname: PhoneNotRegistered
        exp_alerts: []
      - eval_time: 30m
        alertname: PhoneNotRegistered
        exp_alerts:
          - exp_labels: {severity: warning, host: vps-bos, site: bos, ext: "96111", name: Office}
            exp_annotations:
              summary: "Phone 96111 (Office) is not registered with the PBX"
              description: "Calls to it will not ring. Check that the phone is powered and on the network, then look at Reports > Asterisk Info > Peers in FreePBX. If it is meant to be offline, add the extension to the ext!~ list on this rule (prometheus/rules/50-pbx-nas-gateway.yml)."

  # A brand-new guest with no backup yet is NOT reported until a full backup cycle (30 h for the nightly job) has passed; then it is.
  - interval: 1m
    input_series:
      - series: 'rl_pve_backup_expected{vmid="136", name="tdarr", storage="nas-pdx"}'
        values: '1x3000'
      - series: 'rl_pve_backup_expected_since_timestamp_seconds{vmid="136", name="tdarr", storage="nas-pdx"}'
        values: '0x3000'
      - series: 'rl_pve_backup_max_age_seconds{storage="nas-pdx"}'
        values: '108000x3000'
    alert_rule_test:
      - eval_time: 20h
        alertname: BackupNeverRan
        exp_alerts: []
      - eval_time: 30h30m
        alertname: BackupNeverRan
        exp_alerts: []
      - eval_time: 33h
        alertname: BackupNeverRan
        exp_alerts:
          - exp_labels: {severity: warning, site: pdx, vmid: "136", name: tdarr, storage: nas-pdx}
            exp_annotations:
              summary: "Guest tdarr (id 136) has never been backed up to nas-pdx, though a full backup cycle has passed"

  # rl-backup: nightly config backup per remote node. Stale after 30h (+30m grace).
  - interval: 1m
    input_series:
      - series: 'rl_backup_last_success_timestamp_seconds{backup="config", host="pi-pcb"}'
        values: '0x3000'                        # never advances = stuck at epoch
    alert_rule_test:
      - eval_time: 32h
        alertname: NodeBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, backup: config, host: pi-pcb}
            exp_annotations:
              summary: "pi-pcb: no successful config backup for 1d 8h 0m 0s"
              description: "Nightly rl-backup to the NAS Backups share. On the node: journalctl -u rl-backup -n 50 (NAS reachable? SMB password changed? share full?)."

  # Fresh backups never alert; a node that is up but exports no backup series does (after 2h).
  - interval: 1m
    input_series:
      - series: 'rl_backup_last_success_timestamp_seconds{backup="config", host="vps-sjc"}'
        values: '0+60x6000'
      - series: 'rl_backup_last_attempt_timestamp_seconds{backup="config", host="vps-sjc"}'
        values: '0+60x6000'
      - series: 'up{job="node", host="vps-sjc"}'
        values: '1x6000'
      - series: 'up{job="node", host="pi-pdx"}'
        values: '1x6000'
    alert_rule_test:
      - eval_time: 40h
        alertname: NodeBackupStale
        exp_alerts: []
      - eval_time: 3h
        alertname: NodeBackupMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: node, host: pi-pdx}
            exp_annotations:
              summary: "pi-pdx is up but reports no backup metrics (rl-backup not installed or never ran)"
      - eval_time: 3h
        alertname: NodeBackupMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: node, host: pi-pdx}
            exp_annotations:
              summary: "pi-pdx is up but reports no backup metrics (rl-backup not installed or never ran)"
