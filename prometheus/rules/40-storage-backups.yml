groups:
  - name: storage_backups
    rules:
      # Backups: expected set is derived automatically from the Proxmox backup jobs
      # (see scripts/pve-backup-metrics.py), so adding a guest needs no change here.
      - alert: BackupMissing
        expr: |
          (time() - rl_pve_backup_last_success_timestamp_seconds)
            > on(storage) group_left rl_pve_backup_max_age_seconds
          and on(vmid, storage) rl_pve_backup_expected == 1
        for: 30m
        labels: {severity: warning, site: pdx}
        annotations:
          summary: "No recent backup of {{ $labels.name }} on {{ $labels.storage }} (last one {{ $value | humanizeDuration }} ago)"
      - alert: BackupNeverRan
        # A guest with no backup at all, but only once it has been expected for a full backup cycle (30 h for the nightly NAS job,
        # 17 days for the 1st/15th Panama City job). A brand-new guest is simply waiting for its first scheduled run.
        expr: |
          (rl_pve_backup_expected == 1 unless on(vmid, storage) rl_pve_backup_last_success_timestamp_seconds)
            and on(vmid, storage)
          ((time() - rl_pve_backup_expected_since_timestamp_seconds) > on(storage) group_left rl_pve_backup_max_age_seconds)
        for: 1h
        labels: {severity: warning, site: pdx}
        annotations: {summary: "Guest {{ $labels.name }} (id {{ $labels.vmid }}) has never been backed up to {{ $labels.storage }}, though a full backup cycle has passed"}
      - alert: BackupJobFailed
        expr: rl_pve_vzdump_last_ok == 0
        for: 10m
        labels: {severity: warning, site: pdx}
        annotations: {summary: "Last Proxmox backup run ({{ $labels.storage }}) reported errors: {{ $labels.status }}"}
      - alert: BackupCollectorStale
        expr: time() - rl_pve_backup_last_run_timestamp_seconds > 1800
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Backup check script stopped running (backup alerts are blind)"}

      - alert: ProxmoxStorageFull
        expr: (pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"}) > 0.85
        for: 30m
        labels: {severity: warning, site: pdx}
        annotations: {summary: "Proxmox storage {{ $labels.id }} is {{ $value | humanizePercentage }} full"}

      - alert: ProxmoxGuestStoppedUnexpectedly
        expr: pve_up{id=~"(lxc|qemu)/.*"} == 0 and on(id) pve_onboot_status == 1
        for: 10m
        labels: {severity: warning, site: pdx}
        annotations: {summary: "{{ $labels.id }} is stopped but is set to start on boot"}

  - name: hyperbackup
    rules:
      # NAS -> pi-pcb Hyper Backup runs once a day (~09:35 PT). 28h = one day plus 4h grace.
      # A failed/skipped run commits no new version, so staleness is the right signal.
      - alert: HyperBackupStale
        # The backup is observed from its destination (pi-pcb). last_over_time keeps the last known commit for 30 days, so if pi-pcb goes
        # offline the age keeps growing and this still fires after 28 h (a dead site cannot hide a missing backup).
        # Labelled with the NAS (where the backup comes from), not pi-pcb, so a site/host outage does not silence it.
        expr: (time() - last_over_time(rl_hyperbackup_last_commit_timestamp_seconds[30d])) > 28 * 3600
        for: 30m
        labels: {severity: warning, site: pdx, host: nas}
        annotations:
          summary: "No NAS Hyper Backup ({{ $labels.repo }}) has completed for {{ $value | humanizeDuration }}"
          description: "Expected daily around 09:35. Check Hyper Backup on the NAS (task log) and the rsync link to pi-pcb. If Panama City Beach is offline (power or internet), the backup cannot run: this is a consequence of that outage."
      - alert: HyperBackupStuck
        expr: min_over_time(rl_hyperbackup_running[12h]) == 1
        labels: {severity: warning, site: pcb}
        annotations:
          summary: "Hyper Backup {{ $labels.repo }} has been running for over 12 hours"
          description: "A run normally takes minutes. It may be hung or the repository locked."
      - alert: HyperBackupCollectorStale
        expr: time() - rl_hyperbackup_last_run_timestamp_seconds > 1200
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Hyper Backup freshness check on {{ $labels.host }} stopped reporting (that alert is blind)"}
