groups:
  - name: storage_backups
    rules:
      # Backups: expected set is derived automatically from the Proxmox backup jobs
      # (see scripts/pve-backup-metrics.py), so adding a guest needs no change here.
      - alert: BackupMissing
        expr: |
          (time() - rl_pve_backup_last_success_timestamp_seconds)
            > on(storage) group_left rl_pve_backup_max_age_seconds
          and on(vmid, storage) rl_pve_backup_expected == 1
        for: 30m
        labels: {severity: warning, site: pdx}
        annotations:
          summary: "No recent backup of {{ $labels.name }} on {{ $labels.storage }} (last one {{ $value | humanizeDuration }} ago)"
      - alert: BackupNeverRan
        expr: rl_pve_backup_expected == 1 unless on(vmid, storage) rl_pve_backup_last_success_timestamp_seconds
        for: 2h
        labels: {severity: warning, site: pdx}
        annotations: {summary: "Guest {{ $labels.name }} should be backed up to {{ $labels.storage }} but no backup exists"}
      - alert: BackupJobFailed
        expr: rl_pve_vzdump_last_ok == 0
        for: 10m
        labels: {severity: warning, site: pdx}
        annotations: {summary: "Last Proxmox backup run ({{ $labels.storage }}) reported errors: {{ $labels.status }}"}
      - alert: BackupCollectorStale
        expr: time() - rl_pve_backup_last_run_timestamp_seconds > 1800
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Backup check script stopped running (backup alerts are blind)"}

      - alert: ProxmoxStorageFull
        expr: (pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"}) > 0.85
        for: 30m
        labels: {severity: warning, site: pdx}
        annotations: {summary: "Proxmox storage {{ $labels.id }} is {{ $value | humanizePercentage }} full"}

      - alert: ProxmoxGuestStoppedUnexpectedly
        expr: pve_up{id=~"(lxc|qemu)/.*"} == 0 and on(id) pve_onboot_status == 1
        for: 10m
        labels: {severity: warning, site: pdx}
        annotations: {summary: "{{ $labels.id }} is stopped but is set to start on boot"}
