groups:
  - name: services
    rules:
      - alert: ServiceDown
        expr: probe_success{job=~"http|tcp"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is not working ({{ $labels.host }})"
          description: "Check {{ $labels.instance }} has failed for 5+ minutes."

      # Wi-Fi sign-in ("Rainbowlink Identity", 802.1X) is served by the native freeradius.service on the authentik host (NOT an
      # Authentik outpost). 2026-10-10 it crash-looped for ~28 h after a certbot renewal and nothing fired: SystemdUnitFailed only sees
      # state=failed, which a restarting unit leaves within seconds. This watches state=active instead (kept for this unit by the node
      # scrape's metric_relabel_configs). The second branch fires if the unit stops being reported at all while the host is up.
      - alert: WifiRadiusDown
        expr: |
          node_systemd_unit_state{name="freeradius.service", state="active"} == 0
          or (up{job="node", host="authentik"} == 1 unless on() node_systemd_unit_state{name="freeradius.service", state="active"})
        for: 5m
        labels: {severity: warning, service: Wi-Fi sign-in (RADIUS)}
        annotations:
          summary: "Wi-Fi sign-in is down: FreeRADIUS on authentik is not running"
          description: "Nobody can join 'Rainbowlink Identity'. ssh authentik, then systemctl status freeradius and journalctl -u freeradius. Last time the cause was a certbot renewal: /etc/freeradius/3.0/certs/rainbowlink/eap-chain.pem not matching the new key (rebuild-freeradius-eap-chain.sh)."

      - alert: PublicServiceDown
        expr: probe_success{job="http-public"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is unreachable from the internet"
          description: "Probed from outside (vps-sjc). If the internal check is fine, the problem is the WAN, tunnel or DNS."

      - alert: DnsResolverFailing
        expr: probe_success{job="dns"} == 0
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "DNS resolver {{ $labels.host }} failed a real query ({{ $labels.module }})"
          description: "{{ $labels.instance }} did not return a valid answer."

      # Split-horizon: a tailnet-only host must be handed tailnet addresses. Fails if the Split Horizon app stopped,
      # lost its config, or a resolver is serving without it (tailnet clients would then get LAN IPs).
      - alert: DnsSplitHorizonBroken
        expr: probe_success{job="dns-split"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Resolver {{ $labels.host }} is not giving tailnet clients tailnet addresses"
          description: "A tailnet-only host (vps-sjc) asked {{ $labels.instance }} for ha.rainbowlink.org and did not get 100.64.0.27. Check the Split Horizon app (enabled, config present) on that Technitium node. Home clients are unaffected."

      # Both home resolvers failing means nothing on the LAN resolves names.
      - alert: DnsOutage
        expr: sum(probe_success{job="dns", critical_group="dns"}) == 0
        for: 2m
        labels: {severity: critical, site: pdx}
        annotations:
          summary: "DNS OUTAGE: neither dns1 nor dns2 is answering"
          description: "Nothing on the home network can resolve names."

      - alert: CertExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"http|http-public"} - time()) < 21 * 86400
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Certificate for {{ $labels.service }} expires in {{ $value | humanizeDuration }}"
          description: "{{ $labels.instance }}. Check the renewal job (certbot/Cloudflare/Authentik) for this host."

      - alert: HttpSlow
        expr: probe_duration_seconds{job=~"http|http-public"} > 8
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} is very slow ({{ printf \"%.1f\" $value }} s)"}

      # Voice commands: Home Assistant's VoIP integration answers calls from the PBX (72.61.72.237).
      - alert: HaVoipSatelliteUnavailable
        expr: homeassistant_entity_available{entity="assist_satellite.72_61_72_237"} == 0
        for: 10m
        labels: {severity: warning, host: homeassistant, site: pdx}
        annotations:
          summary: "Home Assistant's VoIP voice assistant (PBX2) is unavailable"
          description: "Voice commands over the phone system will not work. Check the VoIP integration in Home Assistant."
      - alert: HaVoipCallsDisabled
        expr: homeassistant_switch_state{entity="switch.72_61_72_237_allow_calls"} == 0
        for: 30m
        labels: {severity: warning, host: homeassistant, site: pdx}
        annotations: {summary: "Home Assistant's VoIP 'Allow calls' switch is off, so the voice assistant will not answer"}

      - alert: HomeAssistantUnavailable
        expr: up{job="homeassistant"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Home Assistant is not exposing metrics"}

  - name: cloudflare
    rules:
      - alert: CloudflareTunnelUnhealthy
        expr: rl_cloudflare_tunnel_healthy == 0
        for: 10m
        labels: {severity: warning, site: pdx}
        annotations:
          summary: "Cloudflare tunnel {{ $labels.tunnel }} is {{ $labels.status }}"
          description: "Every public hostname behind this tunnel is unreachable from the internet. Check cloudflared on cloudflare-int / cloudflare-dmz / Home Assistant."
      - alert: CloudflareTunnelCollectorStale
        expr: time() - rl_cloudflare_last_run_timestamp_seconds > 900
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Cloudflare tunnel health check stopped reporting"}

  - name: dns_sync
    rules:
      # Zones marked sync="all" must carry the SAME serial on every resolver. A short lag after an edit is normal,
      # so only a mismatch that persists for 15 minutes alerts.
      - alert: DnsZoneOutOfSync
        expr: (max by (zone) (rl_dns_zone_serial{sync="all"}) != min by (zone) (rl_dns_zone_serial{sync="all"}))
        for: 15m
        labels: {severity: warning, site: pdx}
        annotations:
          summary: "DNS servers disagree on zone {{ $labels.zone }} (some are serving an older copy)"
          description: "Compare the serials on the Network dashboard (Zone sync). A resolver with a stale zone returns old answers. Check Technitium zone transfer/cluster sync on the lagging server."
      - alert: DnsZoneMissing
        expr: rl_dns_zone_present{sync="all"} == 0
        for: 10m
        labels: {severity: warning, site: pdx}
        annotations:
          summary: "DNS server {{ $labels.server }} is not serving our zone {{ $labels.zone }}"
          description: "It answers without our SOA (or not at all). Queries sent to it for internal names will fail or leak upstream."
      - alert: DnsSyncCheckStale
        expr: time() - rl_dns_sync_last_run_timestamp_seconds > 900
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "DNS zone sync check stopped reporting (replication drift would go unnoticed)"}
