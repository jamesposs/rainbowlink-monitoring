# THE host inventory. One line per host. Add a host = add a line (picked up in ~30s).
#
#   addr    address used for ping (LAN address at home, tailnet address for remote sites)
#   ts_ip   tailnet address where node_exporter listens (omit when there is no agent)
#   site    pdx | pcb | sjc | bos          (alert dependencies hang off this)
#   kind    host | lxc | vm | appliance | vps | rpi
#   parent  pve0 for Proxmox guests        (guests are silenced when pve0 is down)
#   role    free text, used to group dashboards
#   agent   none  -> no node_exporter (appliances; they are polled over SNMP/API)
#   critical: "true" -> HostDown pages you (use sparingly)
- {targets: [pve0],           labels: {addr: 172.20.1.20,  ts_ip: 100.64.0.14, site: pdx, kind: host, role: hypervisor, critical: "true"}}
