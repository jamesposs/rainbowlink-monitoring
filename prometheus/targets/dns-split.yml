# Split-horizon check, asked FROM vps-sjc (a tailnet-only host, so it is treated as a tailnet client).
# Every resolver must hand it the TAILNET address of ha.rainbowlink.org (module dns_split_tailnet, defined on vps-sjc).
# The LAN-side answer (172.20.x) is already proven by targets/dns.yml (module dns_internal) from the monitor host.
# Add a resolver = add a line.
- {targets: ['100.64.0.26'], labels: {module: dns_split_tailnet, host: dns1,    site: pdx, service: dns-split}}
- {targets: ['100.64.0.18'], labels: {module: dns_split_tailnet, host: dns2,    site: pdx, service: dns-split}}
- {targets: ['100.64.0.11'], labels: {module: dns_split_tailnet, host: pi-pcb,  site: pcb, service: dns-split}}
- {targets: ['100.64.0.1'],  labels: {module: dns_split_tailnet, host: vps-sjc, site: sjc, service: dns-split}}
- {targets: ['100.64.0.30'], labels: {module: dns_split_tailnet, host: pi-pdx, site: pdx, service: dns-split}}
