# Real DNS queries. module: dns_internal = a record only our zone knows (proves the
# resolver is authoritative/healthy); dns_recursive = a public name (proves
# forwarding/upstream). Add a resolver = add a line.
- {targets: ['172.20.2.221'], labels: {module: dns_internal,  host: dns1, site: pdx, service: dns, critical_group: dns}}
- {targets: ['172.20.2.221'], labels: {module: dns_recursive, host: dns1, site: pdx, service: dns-recursion}}
- {targets: ['100.64.0.11'],  labels: {module: dns_internal_tailnet, host: pi-pcb, site: pcb, service: dns}}
- {targets: ['172.20.1.37'],  labels: {module: dns_internal,  host: pi-pdx, site: pdx, service: dns, critical_group: dns}}
- {targets: ['172.20.1.37'],  labels: {module: dns_recursive, host: pi-pdx, site: pdx, service: dns-recursion}}
- {targets: ['100.64.0.11'],  labels: {module: dns_recursive, host: pi-pcb, site: pcb, service: dns-recursion}}
- {targets: ['10.77.77.2'],  labels: {module: dns_internal,  host: pi-pcb, site: pcb, service: dns-alt-path}}   # dns3 as the LAN reaches it: through the PDX <> PCB Alternate Path tunnel
