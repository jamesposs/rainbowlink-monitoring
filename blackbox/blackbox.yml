# Probe modules used by Prometheus (targets pick one via their `module` label).
modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp: {preferred_ip_protocol: ip4, ip_protocol_fallback: false}

  http_2xx:                      # HTTPS/HTTP must answer 2xx (redirects followed), cert verified
    prober: http
    timeout: 10s
    http: {preferred_ip_protocol: ip4, ip_protocol_fallback: false, follow_redirects: true}

  http_2xx_insecure:             # self-signed internal UIs (Proxmox, UniFi, DSM): still reports cert expiry
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: true
      tls_config: {insecure_skip_verify: true}

  http_responds:                 # "the service answers HTTP at all" (404/401/403 count as alive)
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_status_codes: [200, 204, 301, 302, 401, 403, 404]
      tls_config: {insecure_skip_verify: true}

  http_health_ok:                # app health endpoint must answer 200 with {"status":"OK"} (no redirects, no login involved)
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['"status"\s*:\s*"OK"']

  http_redirect_sso:             # must answer 302 to our SSO (NOT followed): proves the app's SSO wiring, independent of the SSO server being up
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false
      valid_status_codes: [302]
      fail_if_header_not_matches:
        - {header: Location, regexp: '^https://login\.rainbowlink\.org/application/o/authorize/'}

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp: {preferred_ip_protocol: ip4, ip_protocol_fallback: false}

  dns_internal:                  # a name only OUR zone answers: proves the resolver serves our data
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: ha.rainbowlink.org
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp: ['ha\.rainbowlink\.org\.\s+\d+\s+IN\s+A\s+172\.20\.1\.13']

  dns_internal_tailnet:          # same, but asked OVER THE TAILNET (source = tailnet address), so split-horizon answers with the tailnet IP
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: ha.rainbowlink.org
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp: ['ha\.rainbowlink\.org\.\s+\d+\s+IN\s+A\s+100\.64\.0\.27']

  dns_recursive:                 # a public name: proves forwarding/upstream works
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: cloudflare.com
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: ['IN\s+A\s+\d+\.\d+\.\d+\.\d+']
